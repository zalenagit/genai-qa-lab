[pytest]
testpaths = tests
markers =
    smoke: fast, critical-path checks run on every push
    web: browser tests with Playwright
    api: REST API tests with requests
# --reruns 1 retries a failed test once (course topic: retrying failed tests).
# Keep it low: a test that only passes on retry is flaky and should be fixed, not hidden.
addopts = -v --reruns 1 --reruns-delay 1
          --html=reports/report.html --self-contained-html
          --junitxml=reports/junit.xml
